name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  android:
    name: Android 16 APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          if [ -d /root/.config/godot ]; then mv /root/.config/godot ~/.config/godot; fi
          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi
          godot --version

      - name: Runtime smoke test
        shell: bash
        run: |
          set +e
          godot --headless --path . --quit-after 12 --verbose 2>&1 | tee smoke.log
          CODE=${PIPESTATUS[0]}
          set -e
          if grep -Eiq "SCRIPT ERROR|Parse Error|Invalid call|Invalid set index|Invalid get index|Nonexistent function|Attempt to call function|Cannot assign|Cannot call method|Failed to load script" smoke.log; then
            echo "Runtime/script error detected"
            exit 1
          fi
          if ! grep -q "ROLLING_BALANCE_READY" smoke.log; then
            echo "Game did not reach ready state"
            exit 1
          fi
          if [ "$CODE" -ne 0 ]; then
            echo "Godot smoke test exited with $CODE"
            exit "$CODE"
          fi

      - name: Ensure Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35" "platforms;android-36" "cmdline-tools;latest"

      - name: Build debug APK with Gradle
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --verbose --path . --install-android-build-template --export-debug "Android 16" build/RollingBalance16.apk
          test -s build/RollingBalance16.apk
          ls -lh build/RollingBalance16.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RollingBalance16-APK
          path: build/RollingBalance16.apk
          if-no-files-found: error
          retention-days: 30
